[package]
name = "memo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
cua-driver-sdk = { git = "https://github.com/trycua/cua", tag = "cua-driver-rs-v0.34.0" }
futures-util = "0.3"
regex = "1.12"
rmcp = { version = "3.5.1", features = ["server", "transport-streamable-http-server", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
