stages: [validate, package, release]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  PNPM_VERSION: "11.15.1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths: [.cargo/, node_modules/, apps/desktop/node_modules/]

frontend:
  stage: validate
  image: node:24-bookworm
  tags: [saas-linux-small-amd64]
  script:
    - npm install --global pnpm@$PNPM_VERSION
    - pnpm install --frozen-lockfile
    - npm run typecheck
    - npm run lint
    - node --test scripts/tests/*.test.mjs

rust:
  stage: validate
  image: rust:latest
  tags: [saas-linux-small-amd64]
  before_script:
    - rustup component add clippy rustfmt
    - apt-get update
    - apt-get install -y libx11-dev libxtst-dev libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
  script:
    - cargo test
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo fmt --check

package_linux:
  stage: package
  image: node:24-bookworm
  tags: [saas-linux-medium-amd64]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update
    - apt-get install -y curl build-essential libx11-dev libxtst-dev libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm zstd portaudio19-dev pkg-config
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup default stable
    - npm install --global pnpm@$PNPM_VERSION
    - pnpm install --frozen-lockfile
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - mkdir -p .sandbox-build
    - touch .sandbox-build/MemoSandbox.exe
    - npm run typecheck
    - npm run lint
    - node --test scripts/tests/*.test.mjs
    - cargo build --release
    - python3 -c "import pathlib,shutil,subprocess; host=next(x.split(': ',1)[1] for x in subprocess.check_output(['rustc','-vV'],text=True).splitlines() if x.startswith('host: ')); d=pathlib.Path('apps/desktop/src-tauri/binaries'); d.mkdir(parents=True,exist_ok=True); shutil.copy2('target/release/memo',d/f'memo-{host}')"
    - pnpm --filter @memo/desktop tauri build --bundles deb,rpm,appimage
  artifacts:
    name: "memo-linux-x64-$CI_COMMIT_REF_SLUG"
    expire_in: 14 days
    paths: [apps/desktop/src-tauri/target/release/bundle/]

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags: [saas-linux-small-amd64]
  needs:
    - job: package_linux
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    GITLAB_TOKEN: "$CI_JOB_TOKEN"
  script:
    - mkdir -p release-assets
    - find apps/desktop/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release-assets/ \;
    - test -n "$(find release-assets -type f -print -quit)"
    - sha256sum release-assets/* > release-assets/SHA256SUMS.txt
    - glab release create "$CI_COMMIT_TAG" release-assets/* --name "Memo $CI_COMMIT_TAG" --notes "Linux desktop installers include the native memo Rust CLI. No separate CLI or Python gateway installation is required."
