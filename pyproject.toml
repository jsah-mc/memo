[project]
name = "memo"
version = "0.1.0"
description = "An OpenAI-compatible LiteLLM gateway"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "audioop-lts>=0.2.2",
    "bleak>=3.0.2",
    "fastapi>=0.139.0",
    "litellm>=1.93.0",
    "nvidia-cublas-cu12==12.8.4.1; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.19.0.56; sys_platform == 'win32'",
    "numpy>=2.3.0",
    "openai>=2.24.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.22",
    "python-dotenv==1.2.2",
    "realtimestt[faster-whisper]>=1.0.2",
    "realtimetts[pockettts]>=0.7.1",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.2",
    "uvicorn>=0.49.0",
    "browser-use>=0.11.13,<0.12.0",
    "textual[syntax]>=8.2.8",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "ruff>=0.16.0",
    "cua-driver==0.23.2",
]

[project.scripts]
memo = "utils.cli:main"
memo-browser = "utils.browser.main:main"
memo-stt = "utils.tools.stt:main"
memo-tts = "utils.tools.tts:main"

[dependency-groups]
dev = [
    "black==26.1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
