name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build TUI
        run: pnpm --filter @memo/tui typecheck
      - name: Build Sandbox
        run: pnpm --filter @memo/sandbox typecheck
      - name: Build Installer
        run: pnpm --filter @memo/installer build

  electron:
    name: Electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm exec --yes --package=pnpm@11.20.0 -- pnpm install --frozen-lockfile
      - run: node --test scripts/tests/*.test.mjs
      - name: Typecheck all apps
        run: pnpm typecheck:all
      - name: Lint desktop
        run: pnpm lint
        working-directory: apps/desktop
      - name: Build desktop
        run: npx --no-install vite build
        working-directory: apps/desktop
      - name: Package the macOS application bundle
        if: matrix.os == 'macos-latest'
        run: pnpm package
        working-directory: apps/desktop
