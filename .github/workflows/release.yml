name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            updater_target: linux-x86_64
            bundles: deb,rpm,appimage
          - os: windows-latest
            platform: win32
            arch: x64
            updater_target: windows-x86_64
            bundles: nsis,msi
          - os: macos-latest
            platform: darwin
            arch: arm64
            updater_target: darwin-aarch64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require release signing secrets
        shell: python
        run: |
          import os
          required = ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_UPDATER_PUBLIC_KEY"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
      - name: Configure updater public key
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          path = Path("apps/desktop/src-tauri/tauri.conf.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["plugins"]["updater"]["pubkey"] = os.environ["TAURI_UPDATER_PUBLIC_KEY"]
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const p = require('./apps/desktop/package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) { throw new Error('Release tag must match apps/desktop/package.json version: v' + p.version); }"
      - name: Check synchronized project versions
        run: node scripts/tests/version-sync.test.mjs
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm zstd portaudio19-dev libx11-dev libxtst-dev libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
      - name: Install macOS audio build dependencies
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD GitHub secrets are required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "memo-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "MEMO_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure Windows Authenticode
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          path = Path("apps/desktop/src-tauri/tauri.conf.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["bundle"]["windows"] = {
              "certificateThumbprint": os.environ["MEMO_CERTIFICATE_THUMBPRINT"],
              "digestAlgorithm": "sha256",
              "timestampUrl": "http://timestamp.digicert.com",
          }
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
      - name: Build bundled Python gateway
        run: python scripts/build_gateway.py
      - name: Verify standalone gateway
        run: python scripts/smoke_gateway.py
      - name: Build Windows sandbox
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows_sandbox.ps1
      - name: Prepare sandbox helper for packaging
        if: runner.os != 'Windows'
        run: |
          mkdir -p .sandbox-build
          touch .sandbox-build/MemoSandbox.exe
      - name: Install locked dependencies
        run: npm exec --yes --package=pnpm@11.15.1 -- pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Lint
        working-directory: apps/desktop
        run: npm run lint
      - name: Test release contract
        run: node --test scripts/tests/*.test.mjs
      - name: Build native CLI
        run: cargo build --release
      - name: Build desktop installers and signed updater
        run: npm exec --yes --package=pnpm@11.15.1 -- pnpm --filter @memo/desktop tauri build --bundles ${{ matrix.bundles }}
      - name: Package separate Desktop and CLI installers
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Verify packaged gateway resources
        if: runner.os == 'Linux'
        run: python scripts/smoke_gateway.py --bundle .gateway-build/gateway
      - name: Upload release package and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memo-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release-package/*.zip
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/release/bundle/**/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish signed GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: memo-*
          path: installers
      - name: Build updater manifest and checksums
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          source_root = Path("installers")
          output = Path("release-assets")
          output.mkdir()
          package_zips = sorted(source_root.glob("memo-*/*/memo-*.zip"))
          if not package_zips:
              package_zips = sorted(source_root.rglob("memo-*.zip"))
          for source in package_zips:
              shutil.copy2(source, output / source.name)

          target_map = {
              "memo-linux-x64": "linux-x86_64",
              "memo-win32-x64": "windows-x86_64",
              "memo-darwin-arm64": "darwin-aarch64",
          }
          platforms = {}
          for artifact_dir, target in target_map.items():
              root = source_root / artifact_dir
              signatures = sorted(root.rglob("*.sig"))
              if not signatures:
                  raise RuntimeError(f"No updater signature found for {target}")
              preferred = [p for p in signatures if ("nsis" in p.name.lower() if "windows" in target else True)]
              signature_path = (preferred or signatures)[0]
              payload = Path(str(signature_path)[:-4])
              if not payload.is_file():
                  raise RuntimeError(f"Missing updater payload for {signature_path}")
              released_name = f"{target}-{payload.name}"
              shutil.copy2(payload, output / released_name)
              signature_name = released_name + ".sig"
              shutil.copy2(signature_path, output / signature_name)
              platforms[target] = {
                  "signature": signature_path.read_text(encoding="utf-8").strip(),
                  "url": f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{quote(os.environ['RELEASE_TAG'])}/{quote(released_name)}",
              }

          manifest = {
              "version": os.environ["RELEASE_TAG"].removeprefix("v"),
              "notes": "See the GitHub release notes for details.",
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          (output / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          checksums = []
          for target in sorted(output.iterdir()):
              with target.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              checksums.append(f"{digest}  {target.name}\n")
          (output / "SHA256SUMS.txt").write_text("".join(checksums), encoding="utf-8")
          PY
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Memo ships one ZIP per platform. Each ZIP contains two independent installers:
            - `desktop/` — the native graphical application installer
            - `cli/` — the `memo` terminal app and its install script

            Desktop releases check this GitHub Release for cryptographically signed updates after launch. Windows executables and installers are Authenticode-signed and timestamped. Updater packages use Tauri signatures, and SHA256SUMS.txt covers every published asset.

            The bundled desktop gateway does not require a separate Python installation. AI sign-in and speech model downloads are still required when those features are first used.
