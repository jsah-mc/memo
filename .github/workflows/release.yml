name: Release source installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const p = require('./apps/desktop/package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) throw new Error('Release tag must match v' + p.version)"
      - run: node scripts/tests/version-sync.test.mjs
      - name: Upload installer scripts
        uses: actions/upload-artifact@v4
        with:
          name: memo-source-installers
          path: |
            scripts/install.ps1
            scripts/install.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memo-source-installers
          path: release-assets
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum install.ps1 install.sh > SHA256SUMS.txt
      - name: Publish source installers
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Memo now runs from a managed Electron and Python source checkout at `~/.memo/app`.

            Windows: download `install.ps1` and run it in PowerShell.
            Linux/macOS: download `install.sh` and run `sh install.sh`.

            The installer adds `uv` and `pnpm` when missing, clones or updates the official source, and installs locked Python and JavaScript dependencies. Git must already be installed.
