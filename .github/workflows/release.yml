name: Release prebuilds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const p = require('./apps/desktop/package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) { throw new Error('Release tag must match apps/desktop/package.json version: v' + p.version); }"
      - name: Check synchronized project versions
        run: node scripts/tests/version-sync.test.mjs
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm zstd portaudio19-dev
      - name: Install macOS audio build dependencies
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Build bundled Python gateway
        run: python scripts/build_gateway.py
      - name: Verify standalone gateway
        run: python scripts/smoke_gateway.py
      - name: Install locked dependencies
        run: npm exec --yes --package=pnpm@11.15.1 -- pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Lint
        working-directory: apps/desktop
        run: npm run lint
      - name: Test desktop shell
        run: node --test scripts/tests/*.test.mjs
      - name: Build installers
        run: pnpm build
      - name: Verify packaged gateway resources
        if: runner.os == 'Linux'
        run: python scripts/smoke_gateway.py --bundle .gateway-build/gateway
      - name: Build Arch Linux package
        if: runner.os == 'Linux'
        run: python scripts/build_arch.py
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: memo-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: memo-*
          path: installers
      - name: Collect installers and checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path

          output = Path("release-assets")
          output.mkdir()
          files = sorted(p for p in Path("installers").rglob("*") if p.is_file())
          if not files:
              raise RuntimeError("No installers were downloaded")
          checksums = []
          for source in files:
              target = output / source.name
              if target.exists():
                  raise RuntimeError(f"Duplicate release filename: {source.name}")
              shutil.copyfile(source, target)
              with target.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              checksums.append(f"{digest}  {target.name}\n")
          (output / "SHA256SUMS.txt").write_text("".join(checksums), encoding="utf-8")
          PY
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Prebuilt Memo desktop app for Windows x64, Linux x64, and macOS Apple Silicon.

            Includes the Python gateway and runtime; no Python installation or source checkout is needed. The gateway starts automatically with the desktop app. AI sign-in and speech model downloads are still required when those features are used.

            Linux assets include an Arch Linux .pkg.tar.zst package (install with sudo pacman -U). macOS includes a DMG (drag Memo to Applications).

            Windows builds are unsigned. The macOS app is ad-hoc signed and verified, but is not Apple Developer signed or notarized. SHA256SUMS.txt contains checksums for the uploaded assets.
