name: Verify repository installers

on:
  push:
    branches: [main]
    paths:
      - "scripts/install.ps1"
      - "scripts/install.sh"
      - "scripts/tests/release-packaging.test.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/tests/version-sync.test.mjs
      - name: Verify installer scripts are tracked in the repository
        run: test -f scripts/install.ps1 && test -f scripts/install.sh
