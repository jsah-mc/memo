[package]
name = "memo-desktop"
version = "2.0.0"
description = "Memo local-first AI desktop workbench"
authors = ["jsah-mc"]
edition = "2024"

[lib]
name = "memo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
keyring = "3"
memo = { path = "../../.." }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.2", features = [] }
tauri-plugin-updater = "2.13.3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

