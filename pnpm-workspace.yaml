packages:
  - "apps/*"
  - "packages/*"

blockExoticSubdeps: false
nodeLinker: hoisted

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  koffi: true
  macos-alias: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
